# Temporary release-branch staging workflow; removed after the verified artifact is committed.
name: Stage Build 115 canon
on:
  push:
    branches: [chatgpt/115-release-4-canonization]
    paths: ['.github/workflows/stage-115-canon.yml']

permissions:
  contents: write

jobs:
  stage-canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the frozen candidate and toolchain
        shell: bash
        run: |
          test "$(cat version)" = "v0.1.15"
          test ! -e docs/Canon/0.1.15/auralprint_0.1.15.html
          node --version
          python --version
      - name: Build and verify the release
        shell: bash
        run: |
          npm ci
          npm test
          npm run build
          python scripts/verify_distribution.py
      - name: Archive the exact portable artifact and checksum
        shell: bash
        run: |
          mkdir -p docs/Canon/0.1.15
          cp dist/auralprint_0.1.15.html docs/Canon/0.1.15/auralprint_0.1.15.html
          cmp dist/auralprint_0.1.15.html docs/Canon/0.1.15/auralprint_0.1.15.html
          cd docs/Canon/0.1.15
          sha256sum auralprint_0.1.15.html > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Commit only the canonical artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/Canon/0.1.15/auralprint_0.1.15.html docs/Canon/0.1.15/SHA256SUMS
          # Archive is byte-for-byte source-derived; historical whitespace is preserved.
          git diff --cached --quiet && { echo "Missing new canon artifact"; exit 1; }
          git commit -m "release(canon): archive verified Build 115 portable HTML"
          git push origin HEAD:refs/heads/chatgpt/115-release-4-canonization

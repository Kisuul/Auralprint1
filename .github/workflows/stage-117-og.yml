# One-off research asset import. Remove this workflow before submitting the final PR.
name: Stage approved Auralprint social preview
on:
  push:
    branches: [feat/117-first-party-hosted-metadata]
    paths: ['.github/workflows/stage-117-og.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Import and verify previously owner-approved OG image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/branding/og
          curl --fail --location --retry 2 --max-time 45 'https://auralprint.idiw.net/og/auralprint-116-release5-og.jpg' -o src/assets/branding/og/auralprint-116-release5-og.jpg
          echo '30c2e5f319931b081b63e227dac18095d4d3005a80eb9a44f77da691fb7c483b  src/assets/branding/og/auralprint-116-release5-og.jpg' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/branding/og/auralprint-116-release5-og.jpg
          git commit -m 'assets(hosted): archive approved 1200x630 OG preview source'
          git push origin HEAD:refs/heads/feat/117-first-party-hosted-metadata
